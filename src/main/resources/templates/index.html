<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <title>SYNC - KING | Files</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../static/bootstrap/bootstrap.css" th:href="@{/bootstrap/bootstrap.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../static/css/design.css" th:href="@{/css/design.css}">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg glass-nav sticky-top z-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#"> 
                <i class="bi bi-hdd-network-fill text-primary"></i> SYNC - KING
            </a>
            <div class="d-flex gap-3 align-items-center">
                <!-- Sync Controls -->
                <div class="form-check form-switch me-2 d-none d-md-flex align-items-center">
                    <input class="form-check-input" type="checkbox" id="autoSyncToggle" onchange="toggleAutoSync()">
                    <label class="form-check-label ms-2 text-light small" for="autoSyncToggle">Auto-Sync</label>
                </div>
                <button class="btn btn-glass btn-sm" onclick="triggerSync()" title="Sync Now">
                    <i class="bi bi-arrow-repeat"></i> Sync
                </button>
                <button class="btn btn-glass btn-sm" data-bs-toggle="modal" data-bs-target="#networkModal">
                    <i class="bi bi-router"></i> Network
                </button>
                <button class="btn btn-glass btn-sm" data-bs-toggle="modal" data-bs-target="#uploadModal">
                    <i class="bi bi-cloud-upload"></i> Upload
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-5">
        <!-- Breadcrumbs -->
        <nav aria-label="breadcrumb" class="mb-4 glass-panel p-3 animate-fade-in" style="animation-delay: 0.1s;">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none text-primary">Root</a></li>
                <th:block th:if="${pwd != null && pwd != ''}">
                    <li th:each="p, iterStat : ${#strings.arraySplit(pwd, '/')}" 
                        class="breadcrumb-item text-light" 
                        th:classappend="${iterStat.last} ? 'active' : ''"
                        aria-current="page">
                        <a th:if="${!iterStat.last}" th:href="@{'/d?path=' + ${#strings.substringBefore(pwd, p) + p}}" th:text="${p}" class="text-decoration-none text-primary"></a>
                        <span th:if="${iterStat.last}" th:text="${p}"></span>
                    </li>
                </th:block>
            </ol>
        </nav>

        <!-- Toolbar -->
        <div class="toolbar-container d-flex flex-wrap gap-3 align-items-center justify-content-between mb-4 glass-panel p-3 animate-fade-in" th:unless="${local.totalElements == 0}" style="animation-delay: 0.2s;">
            <div class="input-group" style="max-width: 350px;">
                <span class="input-group-text glass-input border-end-0"><i class="bi bi-search"></i></span> 
                <input type="text" id="searchInput" class="form-control glass-input border-start-0" placeholder="Search files..." onkeyup="filterFiles()">
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="text-muted small">Sort by:</span> 
                <select id="sortSelect" class="form-select glass-input form-select-sm" style="width: auto;" onchange="sortFiles()">
                    <option value="name">Name (A-Z)</option>
                    <option value="date">Date (Newest)</option>
                    <option value="size">Size (Largest)</option>
                </select>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${local.totalElements == 0}" class="text-center py-5 mt-5 animate-fade-in">
            <div class="text-secondary display-1 mb-3">
                <i class="bi bi-inbox"></i>
            </div>
            <h4 class="text-light">Folder is empty</h4>
            <p class="text-muted">Upload files to share them on the network.</p>
            <button class="btn btn-premium mt-3" data-bs-toggle="modal" data-bs-target="#uploadModal">
                <i class="bi bi-cloud-upload"></i> Upload Files
            </button>
        </div>

        <!-- File List -->
        <form id="download-form" action="#" method="post" th:action="@{/zip-stream}" th:object="${form}">
            <div th:unless="${local.totalElements == 0}" class="animate-fade-in" style="animation-delay: 0.3s;">
                <div class="d-flex align-items-center mb-3 px-3">
                    <input class="form-check-input me-3" type="checkbox" id="select-all" onclick="toggleAll(this)">
                    <label class="form-check-label small fw-bold text-muted" for="select-all">Select All</label>
                </div>

                <div id="file-list-container">
                    <div th:each="file : ${local.files}" class="file-item" th:data-name="${file.name.toLowerCase()}" th:data-date="${file.lastModifiedEpoch}" th:data-size="${file.sizeInBytes}">
                        <div class="d-flex align-items-center">
                            <input class="form-check-input file-check me-3" type="checkbox" th:if="${!file.directory}" th:field="*{filecode}" th:value="${file.code}" onchange="updateSelection()">
                            <div class="file-icon">
                                <i th:class="${file.directory} ? 'bi bi-folder-fill text-warning' : 'bi bi-file-earmark-text text-primary'"></i>
                            </div>
                            <div class="file-details">
                                <a th:if="${file.directory}" th:href="@{/d(path=${file.relativePath})}" class="file-name text-decoration-none" th:text="${file.name}">Folder</a>
                                <span th:unless="${file.directory}" class="file-name" th:text="${file.name}">File</span>
                                <div class="file-meta">
                                    <span th:if="${!file.directory}" th:text="${file.size}">2 MB</span> 
                                    <span th:if="${!file.directory}">•</span> 
                                    <span th:text="${file.lastModified}">Today</span>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button th:if="${!file.directory}" type="button" class="btn btn-glass btn-sm rounded-circle" th:onclick="openPreview([[${file.url}]], [[${file.name}]], [[${file.fileType}]])" title="Preview">
                                <i class="bi bi-eye"></i>
                            </button>
                            <a th:if="${!file.directory}" th:href="${file.url}" class="btn btn-glass btn-sm rounded-circle text-success" title="Download"> 
                                <i class="bi bi-download"></i>
                            </a>
                            <a th:if="${file.directory}" th:href="@{/zip-folder(path=${file.relativePath})}" class="btn btn-glass btn-sm rounded-circle text-success" title="Download Folder ZIP"> 
                                <i class="bi bi-file-zip"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            <input type="hidden" id="file-array" name="fileArray">
        </form>
    </div>

    <!-- Selection Bar -->
    <div id="selection-bar" class="selection-bar text-light">
        <span><span id="selected-count" class="fw-bold text-primary">0</span> selected</span>
        <div class="vr bg-secondary mx-2"></div>
        <button type="button" class="btn btn-premium btn-sm" onclick="submitZipDownload()">
            Download ZIP <i class="bi bi-file-zip ms-1"></i>
        </button>
    </div>

    <!-- Network Modal -->
    <div class="modal fade" id="networkModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content glass-modal text-light">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-router"></i> Network Sync Nodes</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3 mb-4">
                        <div class="col-md-5">
                            <input type="text" id="nodeIp" class="form-control glass-input" placeholder="IP Address (e.g. 192.168.1.5)">
                        </div>
                        <div class="col-md-3">
                            <input type="number" id="nodePort" class="form-control glass-input" placeholder="Port" value="9005">
                        </div>
                        <div class="col-md-4 d-flex gap-2">
                            <button class="btn btn-glass w-50" onclick="testNode()"><i class="bi bi-activity"></i> Test</button>
                            <button class="btn btn-premium w-50" onclick="addNode()"><i class="bi bi-plus"></i> Add</button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover mb-0" style="background: transparent;">
                            <thead>
                                <tr>
                                    <th>Status</th>
                                    <th>IP Address</th>
                                    <th>Port</th>
                                    <th>Last Active</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="nodesTableBody">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                    <hr class="border-secondary">
                    <h6 class="mt-3 text-warning">Sync Conflicts</h6>
                    <div id="conflictsContainer" class="small">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal fade" id="uploadModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-modal text-light">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-cloud-upload"></i> Upload Files</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label text-muted small">Select files to upload to current directory</label>
                        <input class="form-control glass-input" type="file" id="fileInput" multiple>
                    </div>
                    <div id="uploadProgressContainer" class="d-none">
                        <div class="d-flex justify-content-between small mb-1">
                            <span id="uploadStatusText">Uploading...</span>
                            <span id="uploadPercentage">0%</span>
                        </div>
                        <div class="progress">
                            <div id="uploadProgressBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-glass" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-premium" onclick="startChunkedUpload()"><i class="bi bi-upload"></i> Start Upload</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div class="modal fade" id="previewModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content glass-modal text-light" style="background: rgba(15, 23, 42, 0.95);">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fs-6" id="previewTitle">Preview</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0 d-flex justify-content-center align-items-center overflow-hidden" id="previewBody" style="min-height: 50vh; background: #000;">
                    <!-- Content dynamically loaded -->
                </div>
                <div class="modal-footer border-top border-secondary py-2">
                    <a href="#" id="previewDownloadBtn" class="btn btn-premium btn-sm"><i class="bi bi-download"></i> Download Original</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Pass context path to JS -->
    <script th:inline="javascript">
        const currentRelativePath = /*[[${pwd}]]*/ '';
    </script>

    <script src="../static/bootstrap/bootstrap.bundle.js" th:src="@{/bootstrap/bootstrap.bundle.js}"></script>
    <script src="../static/js/code.js" th:src="@{/js/code.js}"></script>
</body>
</html>
