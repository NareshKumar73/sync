<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <title>SYNC - KING | Transfer History</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../static/bootstrap/bootstrap.css" th:href="@{/bootstrap/bootstrap.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../static/css/design.css" th:href="@{/css/design.css}">
</head>

<body class="custom-bg-active">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg glass-nav sticky-top z-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}"> 
                <i class="bi bi-hdd-network-fill" style="color: var(--accent);"></i> SYNC - KING
            </a>
            <div class="d-flex gap-3 align-items-center">
                <a class="btn btn-surface btn-sm" th:href="@{/}" title="Home">
                    <i class="bi bi-house text-secondary"></i> Home
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-4">
        <!-- Breadcrumbs -->
        <nav aria-label="breadcrumb" class="mb-4 surface-panel p-3 animate-fade-in" style="animation-delay: 0.1s;">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none fw-medium" style="color: var(--accent);">Root</a></li>
                <li class="breadcrumb-item active text-primary fw-medium" aria-current="page">Transfer History</li>
            </ol>
        </nav>

        <div class="surface-panel p-4 animate-fade-in" style="animation-delay: 0.2s;">
            <h4 class="mb-4 text-primary fw-bold"><i class="bi bi-clock-history me-2"></i>Transfer History</h4>
            
            <div th:if="${historyList == null || historyList.empty}" class="text-center py-5 mt-3">
                <div class="text-secondary display-1 mb-3 opacity-50">
                    <i class="bi bi-inbox"></i>
                </div>
                <h5 class="text-primary">No transfer history</h5>
                <p class="text-secondary">Your upload and download history will appear here.</p>
            </div>

            <div th:unless="${historyList == null || historyList.empty}" class="table-responsive">
                <table class="table table-hover align-middle table-custom">
                    <thead>
                        <tr>
                            <th scope="col">Date/Time</th>
                            <th scope="col">Type</th>
                            <th scope="col">Filename</th>
                            <th scope="col">IP Address</th>
                            <th scope="col">Size</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="history : ${historyList}">
                            <td class="text-nowrap" th:text="${#temporals.format(history.timestamp, 'yyyy-MM-dd HH:mm:ss')}">2026-05-20 12:00:00</td>
                            <td>
                                <span th:if="${history.type == 'MANUAL_UPLOAD'}" class="badge bg-success"><i class="bi bi-cloud-arrow-up me-1"></i> Upload</span>
                                <span th:if="${history.type == 'MANUAL_DOWNLOAD'}" class="badge bg-primary"><i class="bi bi-cloud-arrow-down me-1"></i> Download</span>
                                <span th:if="${history.type == 'SYNC_JOB'}" class="badge bg-info text-dark"><i class="bi bi-arrow-repeat me-1"></i> Sync</span>
                                <span th:unless="${history.type == 'MANUAL_UPLOAD' or history.type == 'MANUAL_DOWNLOAD' or history.type == 'SYNC_JOB'}" class="badge bg-secondary" th:text="${history.type}">Other</span>
                            </td>
                            <td class="text-break fw-medium" th:text="${history.filename}">file.txt</td>
                            <td class="text-muted" th:text="${history.ipAddress}">192.168.1.1</td>
                            <td class="text-nowrap" th:text="${history.formattedSize}">1.5 MB</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../static/bootstrap/bootstrap.bundle.js" th:src="@{/bootstrap/bootstrap.bundle.js}"></script>
</body>
</html>
